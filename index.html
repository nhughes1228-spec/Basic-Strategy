<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4a3d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blackjack Trainer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      #hit-btn,
      #stand-btn {
        min-height: 62px;
        padding-inline: 26px;
        font-size: 1.05rem;
        font-weight: 950;
      }

      #double-btn,
      #split-btn,
      #surrender-btn {
        min-height: 52px;
        padding-inline: 18px;
      }

      .playing-card > img {
        display: block !important;
        z-index: 2;
      }

      .playing-card.back {
        background: transparent !important;
      }

      .playing-card.back::before,
      .playing-card[aria-label$="S"]::before,
      .playing-card[aria-label$="H"]::before,
      .playing-card[aria-label$="D"]::before,
      .playing-card[aria-label$="C"]::before {
        content: none !important;
        display: none !important;
      }

      .playing-card[aria-label$="S"] .corner,
      .playing-card[aria-label$="H"] .corner,
      .playing-card[aria-label$="D"] .corner,
      .playing-card[aria-label$="C"] .corner,
      .playing-card[aria-label$="S"] .pip,
      .playing-card[aria-label$="H"] .pip,
      .playing-card[aria-label$="D"] .pip,
      .playing-card[aria-label$="C"] .pip {
        display: none !important;
      }

      .strategy-table td[class^="action-"] {
        position: relative;
        min-width: 54px;
        height: 42px;
        padding: 5px 6px !important;
        color: transparent !important;
        text-shadow: none !important;
        vertical-align: middle;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34);
      }

      .strategy-table td[class^="action-"]::after {
        position: absolute;
        inset: 50% auto auto 50%;
        display: inline-grid;
        place-items: center;
        min-width: 34px;
        height: 22px;
        padding: 0 9px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 999px;
        color: #fff;
        font-size: 0.78rem;
        font-weight: 1000;
        letter-spacing: 0.03em;
        line-height: 1;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
        transform: translate(-50%, -50%);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.28);
      }

      .strategy-table .action-hit,
      .strategy-table .action-surrender {
        background: linear-gradient(135deg, #23e46b, #0e9f45) !important;
      }

      .strategy-table .action-hit::after,
      .strategy-table .action-surrender::after {
        content: "H";
        background: #05782e;
      }

      .strategy-table .action-stand {
        background: linear-gradient(135deg, #ff595e, #c9182b) !important;
      }

      .strategy-table .action-stand::after {
        content: "S";
        background: #991321;
      }

      .strategy-table .action-double {
        background: linear-gradient(135deg, #2f9cff, #1155cc) !important;
      }

      .strategy-table .action-double::after {
        content: "D";
        background: #0b3f9e;
      }

      .strategy-table .action-split {
        background: linear-gradient(135deg, #b26cff, #6e35c9) !important;
      }

      .strategy-table .action-split::after {
        content: "SP";
        background: #5426a5;
      }

      .book-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 800;
      }

      .book-legend span:nth-child(5) {
        display: none !important;
      }

      .book-legend b {
        display: inline-grid;
        place-items: center;
        min-width: 28px;
        height: 19px;
        border-radius: 999px;
        color: #fff;
        font-size: 0.76rem;
        line-height: 1;
      }

      .book-legend span:nth-child(4) b {
        min-width: 34px;
      }

      .book-legend span:has(b)::before {
        content: "";
        width: 16px;
        height: 16px;
        border-radius: 5px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.38);
      }

      .book-legend span:nth-child(1)::before { background: #23e46b; }
      .book-legend span:nth-child(1) b { background: #05782e; }
      .book-legend span:nth-child(2)::before { background: #ff595e; }
      .book-legend span:nth-child(2) b { background: #991321; }
      .book-legend span:nth-child(3)::before { background: #2f9cff; }
      .book-legend span:nth-child(3) b { background: #0b3f9e; }
      .book-legend span:nth-child(4)::before { background: #b26cff; }
      .book-legend span:nth-child(4) b { background: #5426a5; }

      @media (max-width: 680px) {
        #hit-btn,
        #stand-btn {
          min-height: 64px;
          font-size: 1.08rem;
        }

        #double-btn,
        #split-btn,
        #surrender-btn {
          min-height: 52px;
          font-size: 0.92rem;
        }

        .book-backdrop {
          padding: 8px !important;
        }

        .strategy-book {
          width: calc(100vw - 16px) !important;
          padding: 10px !important;
        }

        .strategy-scroll {
          overflow-x: hidden !important;
        }

        .strategy-table table {
          min-width: 0 !important;
          width: 100% !important;
          table-layout: fixed;
          font-size: clamp(0.56rem, 2.25vw, 0.72rem) !important;
        }

        .strategy-table th,
        .strategy-table td {
          padding: 4px 2px !important;
        }

        .strategy-table th:first-child {
          min-width: 0 !important;
          width: 19% !important;
          font-size: 0.66rem !important;
        }

        .strategy-table td[class^="action-"] {
          min-width: 0 !important;
          height: 32px !important;
          padding: 3px 1px !important;
        }

        .strategy-table td[class^="action-"]::after {
          min-width: 22px;
          height: 17px;
          padding: 0 5px;
          font-size: 0.58rem;
        }

        .strategy-table .action-split::after {
          min-width: 27px;
          padding: 0 4px;
          font-size: 0.52rem;
        }
      }
    </style>
    <script>
      (() => {
        const cardAssetBase = new URL("./cards/", window.location.href).href;

        function normalizeCardImage(img) {
          const rawSrc = img.getAttribute("src") || "";
          if (!rawSrc.startsWith("/cards/")) return;
          const fileName = rawSrc.split("/").pop();
          if (!fileName) return;
          img.style.display = "";
          img.src = cardAssetBase + fileName;
        }

        function normalizeAllCardImages(root = document) {
          root.querySelectorAll?.('img[src^="/cards/"]').forEach(normalizeCardImage);
        }

        function normalizeStrategyBook(root = document) {
          root.querySelectorAll?.(".book-legend span").forEach((item) => {
            const badge = item.querySelector("b");
            if (badge?.textContent?.trim() === "P") badge.textContent = "SP";
            if (badge?.textContent?.trim() === "R") item.remove();
          });
        }

        document.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            if (target instanceof HTMLImageElement) normalizeCardImage(target);
          },
          true,
        );

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node instanceof HTMLImageElement) normalizeCardImage(node);
              if (node instanceof Element) {
                normalizeAllCardImages(node);
                normalizeStrategyBook(node);
              }
            }
          }
        });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () => {
            normalizeAllCardImages();
            normalizeStrategyBook();
            observer.observe(document.body, { childList: true, subtree: true });
          });
        } else {
          normalizeAllCardImages();
          normalizeStrategyBook();
          observer.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>
    <title>Blackjack Basic Strategy Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
