<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4a3d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blackjack Trainer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      #hit-btn,
      #stand-btn {
        min-height: 62px;
        padding-inline: 26px;
        font-size: 1.05rem;
        font-weight: 950;
      }

      #double-btn,
      #split-btn,
      #surrender-btn {
        min-height: 52px;
        padding-inline: 18px;
      }

      .playing-card > img {
        display: block !important;
        z-index: 2;
      }

      .playing-card.back {
        background: transparent !important;
      }

      .playing-card.back::before,
      .playing-card[aria-label$="S"]::before,
      .playing-card[aria-label$="H"]::before,
      .playing-card[aria-label$="D"]::before,
      .playing-card[aria-label$="C"]::before {
        content: none !important;
        display: none !important;
      }

      .playing-card[aria-label$="S"] .corner,
      .playing-card[aria-label$="H"] .corner,
      .playing-card[aria-label$="D"] .corner,
      .playing-card[aria-label$="C"] .corner,
      .playing-card[aria-label$="S"] .pip,
      .playing-card[aria-label$="H"] .pip,
      .playing-card[aria-label$="D"] .pip,
      .playing-card[aria-label$="C"] .pip {
        display: none !important;
      }

      @media (max-width: 680px) {
        #hit-btn,
        #stand-btn {
          min-height: 64px;
          font-size: 1.08rem;
        }

        #double-btn,
        #split-btn,
        #surrender-btn {
          min-height: 52px;
          font-size: 0.92rem;
        }
      }
    </style>
    <script>
      (() => {
        const cardAssetBase = new URL("./cards/", window.location.href).href;

        function normalizeCardImage(img) {
          const rawSrc = img.getAttribute("src") || "";
          if (!rawSrc.startsWith("/cards/")) return;
          const fileName = rawSrc.split("/").pop();
          if (!fileName) return;
          img.style.display = "";
          img.src = cardAssetBase + fileName;
        }

        function normalizeAllCardImages(root = document) {
          root.querySelectorAll?.('img[src^="/cards/"]').forEach(normalizeCardImage);
        }

        document.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            if (target instanceof HTMLImageElement) normalizeCardImage(target);
          },
          true,
        );

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node instanceof HTMLImageElement) normalizeCardImage(node);
              if (node instanceof Element) normalizeAllCardImages(node);
            }
          }
        });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () => {
            normalizeAllCardImages();
            observer.observe(document.body, { childList: true, subtree: true });
          });
        } else {
          normalizeAllCardImages();
          observer.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>
    <title>Blackjack Basic Strategy Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
