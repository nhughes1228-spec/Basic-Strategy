<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4a3d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blackjack Trainer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      #hit-btn,
      #stand-btn {
        min-height: 62px;
        padding-inline: 26px;
        font-size: 1.05rem;
        font-weight: 950;
      }

      #double-btn,
      #split-btn,
      #surrender-btn {
        min-height: 52px;
        padding-inline: 18px;
      }

      .playing-card[aria-label$="S"]::before,
      .playing-card[aria-label$="H"]::before,
      .playing-card[aria-label$="D"]::before,
      .playing-card[aria-label$="C"]::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background-repeat: no-repeat;
        background-size: 482% 424%;
      }

      .playing-card[aria-label$="S"] > img,
      .playing-card[aria-label$="H"] > img,
      .playing-card[aria-label$="D"] > img,
      .playing-card[aria-label$="C"] > img,
      .playing-card[aria-label$="S"] .corner,
      .playing-card[aria-label$="H"] .corner,
      .playing-card[aria-label$="D"] .corner,
      .playing-card[aria-label$="C"] .corner,
      .playing-card[aria-label$="S"] .pip,
      .playing-card[aria-label$="H"] .pip,
      .playing-card[aria-label$="D"] .pip,
      .playing-card[aria-label$="C"] .pip {
        display: none !important;
      }

      .playing-card[aria-label$="S"]::before { background-image: url("./cards/spades.png"); }
      .playing-card[aria-label$="H"]::before { background-image: url("./cards/hearts.png"); }
      .playing-card[aria-label$="D"]::before { background-image: url("./cards/diamonds.png"); }
      .playing-card[aria-label$="C"]::before { background-image: url("./cards/clubs.png"); }

      .playing-card[aria-label^="A"]::before { background-position: 5.8% 3.7%; }
      .playing-card[aria-label^="2"]::before { background-position: 35.5% 3.7%; }
      .playing-card[aria-label^="3"]::before { background-position: 64.7% 3.7%; }
      .playing-card[aria-label^="4"]::before { background-position: 93.5% 3.7%; }
      .playing-card[aria-label^="5"]::before { background-position: 5.8% 37.2%; }
      .playing-card[aria-label^="6"]::before { background-position: 35.5% 37.2%; }
      .playing-card[aria-label^="7"]::before { background-position: 64.7% 37.2%; }
      .playing-card[aria-label^="8"]::before { background-position: 93.5% 37.2%; }
      .playing-card[aria-label^="9"]::before { background-position: 5.8% 69.7%; }
      .playing-card[aria-label^="10"]::before { background-position: 35.5% 69.7%; }
      .playing-card[aria-label^="J"]::before { background-position: 64.7% 69.7%; }
      .playing-card[aria-label^="Q"]::before { background-position: 93.5% 69.7%; }
      .playing-card[aria-label^="K"]::before { background-position: 5.8% 100%; }

      @media (max-width: 680px) {
        #hit-btn,
        #stand-btn {
          min-height: 64px;
          font-size: 1.08rem;
        }

        #double-btn,
        #split-btn,
        #surrender-btn {
          min-height: 52px;
          font-size: 0.92rem;
        }
      }
    </style>
    <title>Blackjack Basic Strategy Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
